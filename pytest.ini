[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers

# Mọi warning đều là lỗi: warning mới xuất hiện sẽ làm test đỏ ngay thay vì trôi qua
# không ai để ý. Chỉ bỏ qua warning phát sinh bên trong thư viện mà dự án không sửa được,
# và mỗi dòng bỏ qua phải ghi rõ lý do.
filterwarnings =
    error
    # starlette.testclient dùng alias anyio cũ. Lỗi của thư viện, không phải của dự án.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
